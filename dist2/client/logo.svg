<!--
ToDay Brand - Logo Concept 6: "Line Art Pavilion"
Style: Architectural line-art + minimalist wordmark
Color: Warm Stone #4A4638 + Clay #B86B4E
Concept: A stylized pergola/pavilion line drawing representing outdoor living spaces,
paired with clean typography. Evokes the experience of outdoor living, not just furniture.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <style>
      .stroke-primary { stroke: #4A4638; }
      .stroke-accent { stroke: #B86B4E; }
      .fill-accent { fill: #B86B4E; }
      .text-primary { fill: #4A4638; }
      .text-accent { fill: #B86B4E; }

      @media (prefers-color-scheme: dark) {
        .stroke-primary { stroke: #D4CFC5; }
        .stroke-accent { stroke: #E8997A; }
        .fill-accent { fill: #E8997A; }
        .text-primary { fill: #D4CFC5; }
        .text-accent { fill: #E8997A; }
      }
    </style>
  </defs>

  <!-- Pergola structure -->
  <g class="stroke-primary" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Posts -->
    <line x1="30" y1="50" x2="30" y2="120"/>
    <line x1="110" y1="50" x2="110" y2="120"/>
    <!-- Top beam -->
    <line x1="20" y1="50" x2="120" y2="50"/>
    <!-- Rafter beams (horizontal) -->
    <line x1="20" y1="58" x2="120" y2="58" stroke-width="1.5"/>
    <line x1="20" y1="66" x2="120" y2="66" stroke-width="1.5"/>
  </g>

  <!-- Sun inside pergola -->
  <circle cx="70" cy="100" r="12" class="stroke-accent" stroke-width="1.5" fill="none"/>
  <circle cx="70" cy="100" r="5" class="fill-accent"/>
  <g class="stroke-accent" stroke-width="1" stroke-linecap="round">
    <line x1="70" y1="76" x2="70" y2="68"/>
    <line x1="85" y1="85" x2="91" y2="79"/>
    <line x1="94" y1="100" x2="102" y2="100"/>
  </g>

  <!-- Ground -->
  <line x1="20" y1="122" x2="120" y2="122" class="stroke-primary" stroke-width="1" opacity="0.4"/>

  <!-- Wordmark -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="145" y="95" font-size="42" font-weight="200" class="text-primary" letter-spacing="0">ToDay</text>
    <text x="145" y="115" font-size="10" font-weight="400" class="text-accent" letter-spacing="5">LIVE IN TODAY</text>
    <line x1="145" y1="125" x2="220" y2="125" class="stroke-accent" stroke-width="1"/>
  </g>
</svg>
